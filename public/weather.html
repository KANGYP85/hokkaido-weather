<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>道北今日旅遊天氣</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --surface2: #F5F5F5;
  --border: rgba(0,0,0,0.09);
  --text: #222222;
  --muted: #555555;
  --green: #06C755;
  --ice: #3B8FD4;
  --warn: #E07A20;
  --danger: #D03040;
  --teal: #0F9E8C;
  --gold: #C8860A;
  --radius: 16px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  padding-bottom: 40px;
}

/* Header */
.header {
  background: #1A7ACC;
  padding: 20px 20px 16px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}

.header-title {
  font-size: 22px;
  font-weight: 900;
  color: white;
}

.header-sub {
  font-size: 17px;
  color: rgba(255,255,255,0.55);
}

.live-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 16px;
  font-weight: 700;
  color: #A8F0C8;
}

.live-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:.5; transform:scale(1.5); }
}

/* City tabs */
.city-tabs {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.city-tab {
  flex: 1;
  padding: 12px 6px 10px;
  text-align: center;
  cursor: pointer;
  font-size: 16px;
  font-weight: 500;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}

.city-tab.active {
  color: #1A7ACC;
  border-bottom-color: #1A7ACC;
  font-weight: 700;
}

/* Loading */
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  gap: 12px;
  color: var(--muted);
  font-size: 17px;
}

.spinner {
  width: 32px; height: 32px;
  border: 3px solid rgba(0,0,0,0.08);
  border-top-color: #1A7ACC;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* City content */
.city-content { display: none; }
.city-content.active { display: block; }

/* Main weather card */
.main-card {
  margin: 16px 16px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.main-card-top {
  background: #1A7ACC;
  padding: 18px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.city-info { flex: 1; }

.city-name {
  font-size: 26px;
  font-weight: 900;
  color: white;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.weather-label-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.weather-label { font-size: 17px; color: var(--muted); }

.temp-display { text-align: right; }

.temp-big {
  font-size: 52px;
  font-weight: 900;
  line-height: 1;
  color: white;
  letter-spacing: -1px;
}

.temp-unit { font-size: 22px; color: rgba(255,255,255,0.6); }
.feels-like { font-size: 16px; color: rgba(255,255,255,0.55); margin-top: 4px; }

/* Stats row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--border);
}

.stat-item {
  padding: 10px 8px;
  text-align: center;
  border-right: 1px solid var(--border);
}

.stat-item:last-child { border-right: none; }

.stat-icon { font-size: 16px; margin-bottom: 3px; }
.stat-val { font-size: 16px; font-weight: 700; color: var(--text); }
.stat-lbl { font-size: 13px; color: var(--muted); margin-top: 1px; }

/* Summary banner */
.summary-banner {
  margin: 12px 16px 0;
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  border: 1px solid transparent;
}

.banner-ok     { background: #EDFBF3; border-color: #B6EDD0; }
.banner-warn   { background: #FFF4EA; border-color: #FCCF99; }
.banner-danger { background: #FEF0F0; border-color: #FBBBBB; }

.banner-icon { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
.banner-text { font-size: 17px; line-height: 1.6; }
.banner-ok .banner-text     { color: #1A7A46; }
.banner-warn .banner-text   { color: #9A5010; }
.banner-danger .banner-text { color: #9A2020; }

/* Tips */
.tips-section { margin: 12px 16px 0; }

.tips-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.tip-item {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 6px;
  font-size: 16px;
  color: var(--text);
  line-height: 1.5;
}

.tip-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #E07A20;
  flex-shrink: 0;
  margin-top: 5px;
}

/* Spots */
.spots-section { margin: 12px 16px 0; }

.spots-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.spot-chip {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 17px;
  color: var(--muted);
}

.spot-chip.ok {
  background: #FFF3E0;
  border-color: #FFCC80;
  color: #8B4500;
}

.spot-chip.warn {
  background: #FEF0F0;
  border-color: #FBBBBB;
  color: #9A2020;
}

.spot-type {
  margin-left: 5px;
  font-size: 17px;
  opacity: 0.6;
  font-weight: 400;
}

/* Snow trend */
.trend-section { margin: 12px 16px 0; }

.trend-bars {
  display: flex;
  gap: 6px;
  align-items: flex-end;
  height: 48px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px 8px;
}

.trend-bar-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  height: 100%;
  justify-content: flex-end;
}

.trend-bar {
  width: 100%;
  background: var(--ice);
  border-radius: 3px 3px 0 0;
  min-height: 2px;
  transition: height 0.5s ease;
}

.trend-hour { font-size: 13px; color: var(--muted); }

/* JMA alerts */
.alerts-section { margin: 12px 16px 0; }

.alert {
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 6px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  border: 1px solid transparent;
  font-size: 16px;
}

.alert-danger { background: #FEF0F0; border-color: #FBBBBB; }
.alert-warn   { background: #FFF4EA; border-color: #FCCF99; }
.alert-info   { background: #EEF6FD; border-color: #B6D8F5; }

.alert-icon { font-size: 16px; flex-shrink: 0; }
.alert-label { font-size: 17px; font-weight: 700; }
.alert-danger .alert-label { color: #9A2020; }
.alert-warn   .alert-label { color: #9A5010; }
.alert-info   .alert-label { color: #1A5A8A; }

.alert-ok {
  background: #EDFBF3;
  border-color: #B6EDD0;
}
.alert-ok .alert-label { color: #1A7A46; }

.updated-row {
  text-align: center;
  font-size: 16px;
  color: var(--muted);
  margin-top: 16px;
  padding: 0 16px;
}

.mode-tab {
  flex: 1;
  padding: 10px 6px 8px;
  text-align: center;
  cursor: pointer;
  font-size: 16px;
  font-weight: 500;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}

.mode-tab.active {
  color: #E07A20;
  border-bottom-color: #E07A20;
  font-weight: 700;
}

.forecast-day {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.fc-date { font-size: 16px; color: var(--muted); width: 100px; flex-shrink: 0; }
.fc-weather { font-size: 22px; flex-shrink: 0; }
.fc-label { font-size: 16px; color: var(--muted); flex: 1; }
.fc-right { text-align: right; }
.fc-temps { font-size: 17px; font-weight: 700; white-space: nowrap; }
.fc-max { color: #D03040; }
.fc-min { color: #3B8FD4; }
.fc-snow { font-size: 16px; color: #3B8FD4; margin-top: 2px; }

.climate-month {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
}

.cm-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.cm-month { font-size: 17px; font-weight: 700; }
.cm-note { font-size: 17px; color: var(--muted); margin-top: 2px; line-height: 1.5; }

.cm-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 8px;
}

.cm-stat {
  background: var(--surface2);
  border-radius: 8px;
  padding: 6px 4px;
  text-align: center;
}

.cm-stat-val { font-size: 16px; font-weight: 700; }
.cm.stat-lbl { font-size: 13px; color: var(--muted); margin-top: 1px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">道北今日旅遊天氣</div>
      <div class="header-sub">台灣旅客看得懂的在地天氣判斷</div>
    </div>
    <div class="live-badge">
      <div class="live-dot"></div>
      即時更新
    </div>
  </div>
</div>

<!-- City tabs -->
<div class="city-tabs">
  <div class="city-tab active" onclick="switchCity('asahikawa', this)">旭川</div>
  <div class="city-tab" onclick="switchCity('biei', this)">美瑛</div>
  <div class="city-tab" onclick="switchCity('furano', this)">富良野</div>
</div>

<!-- Mode tabs -->
<div style="display:flex; background:#fff; border-bottom:1px solid var(--border);">
  <div class="mode-tab active" id="mtab-today" onclick="switchMode('today', this)">今日天氣</div>
  <div class="mode-tab" id="mtab-forecast" onclick="switchMode('forecast', this)">16天預報</div>
  <div class="mode-tab" id="mtab-climate" onclick="switchMode('climate', this)">穿著指南</div>
</div>

<!-- Loading -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <div>正在取得即時天氣資料…</div>
</div>

<!-- City pages -->
<div id="content" style="display:none;">

  <!-- 今日天氣 -->
  <div id="mode-today">
    <div class="city-content active" id="page-asahikawa"></div>
    <div class="city-content" id="page-biei"></div>
    <div class="city-content" id="page-furano"></div>
  </div>

  <!-- 16天預報 -->
  <div id="mode-forecast" style="display:none; padding:16px;">
    <div id="forecast-content"></div>
  </div>

  <!-- 月份氣候 -->
  <div id="mode-climate" style="display:none; padding:16px;">
    <div id="climate-content"></div>
  </div>

</div>

<script>
const API_BASE = window.location.origin;
const cache = {};
let currentCity = 'asahikawa';
let currentMode = 'today';

function switchMode(mode, el) {
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentMode = mode;

  document.getElementById('mode-today').style.display = mode === 'today' ? 'block' : 'none';
  document.getElementById('mode-forecast').style.display = mode === 'forecast' ? 'block' : 'none';
  document.getElementById('mode-climate').style.display = mode === 'climate' ? 'block' : 'none';

  if (mode === 'forecast') loadForecast(currentCity);
  if (mode === 'climate') loadClimate(currentCity);
}

async function loadForecast(cityKey) {
  const el = document.getElementById('forecast-content');
  el.innerHTML = `<div class="loading"><div class="spinner"></div><div>取得16天預報中…</div></div>`;
  try {
    const r = await fetch(`${API_BASE}/api/forecast?city=${cityKey}`);
    const data = await r.json();
    renderForecast(data);
  } catch {
    el.innerHTML = `<div style="color:var(--danger); padding:20px; text-align:center;">無法取得預報資料</div>`;
  }
}

function renderForecast(data) {
  const el = document.getElementById('forecast-content');
  el.innerHTML = `
    <div style="font-size:15px; color:var(--muted); margin-bottom:12px; font-weight:700; letter-spacing:0.08em;">📅 ${data.city} — 未來 16 天預報</div>
    ${data.days.map(d => {
      const snowText = d.snow > 0 ? `❄️ 雪 ${d.snow}mm` : d.rain > 0 ? `🌧️ 雨 ${d.rain}mm` : '';
      const popText = d.pop > 0 ? `${d.pop}%` : '';
      const levelColor = d.level === 'heavy_snow' || d.level === 'blizzard' ? '#3B8FD4'
        : d.level === 'rain' ? '#555' : 'var(--text)';
      return `<div class="forecast-day">
        <div class="fc-date">${d.label}</div>
        <div class="fc-weather">${d.emoji}</div>
        <div class="fc-label" style="color:${levelColor}">${d.weather}</div>
        <div class="fc-right">
          <div class="fc-temps">
            <span class="fc-max">${d.tempMax}°</span>
            <span style="color:var(--muted);"> / </span>
            <span class="fc-min">${d.tempMin}°</span>
          </div>
          ${snowText ? `<div class="fc-snow">${snowText}${popText ? ` · ${popText}` : ''}</div>` : ''}
        </div>
      </div>`;
    }).join('')}
  `;
}

async function loadClimate(cityKey) {
  const el = document.getElementById('climate-content');
  const today = new Date().toISOString().slice(0, 10);
  el.innerHTML = `
    <div style="font-size:15px; color:var(--muted); margin-bottom:12px; font-weight:700; letter-spacing:0.08em;">
      👕 ${getCityName(cityKey)} — 穿著指南（台灣人體感）
    </div>
    <div style="background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:16px;">
      <div style="font-size:15px; font-weight:700; margin-bottom:10px;">查詢特定日期穿著建議</div>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <input type="date" id="outfit-date" value="${today}" style="flex:1; min-width:140px; font-size:16px;" />
        <button onclick="queryOutfit('${cityKey}')" style="font-size:15px; padding:6px 16px; background:#E07A20; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:700;">查詢穿著</button>
      </div>
      <div style="font-size:15px; color:var(--muted); margin-top:8px;">根據過去5年同期氣候資料推算，未來日期也可以查</div>
    </div>
    <div id="outfit-result"></div>
    <div style="font-size:15px; color:var(--muted); margin-bottom:10px; font-weight:700; letter-spacing:0.08em; margin-top:4px;">📅 各月份快速參考</div>
    <div id="month-cards"></div>
  `;
  renderMonthCards(cityKey);
}

function renderMonthCards(cityKey) {
  const el = document.getElementById('month-cards');
  if (!el) return;
  const now = new Date().getMonth() + 1;
  const months = [
    { m:1,  icon:'❄️', label:'1月', tempMax:-3, tempMin:-12, tag:'極寒' },
    { m:2,  icon:'🎪', label:'2月', tempMax:-1, tempMin:-11, tag:'嚴寒' },
    { m:3,  icon:'🌨️', label:'3月', tempMax:4,  tempMin:-5,  tag:'仍冷' },
    { m:4,  icon:'🌸', label:'4月', tempMax:12, tempMin:1,   tag:'涼' },
    { m:5,  icon:'🌼', label:'5月', tempMax:18, tempMin:6,   tag:'舒適' },
    { m:6,  icon:'🌿', label:'6月', tempMax:23, tempMin:11,  tag:'微涼' },
    { m:7,  icon:'💜', label:'7月', tempMax:27, tempMin:16,  tag:'溫暖' },
    { m:8,  icon:'🌻', label:'8月', tempMax:28, tempMin:17,  tag:'溫暖' },
    { m:9,  icon:'🍂', label:'9月', tempMax:22, tempMin:11,  tag:'微涼' },
    { m:10, icon:'🍁', label:'10月',tempMax:14, tempMin:4,   tag:'涼' },
    { m:11, icon:'🌨️', label:'11月',tempMax:5,  tempMin:-3,  tag:'冷' },
    { m:12, icon:'⛄', label:'12月',tempMax:-1, tempMin:-9,  tag:'嚴寒' },
  ];

  el.innerHTML = months.map(m => {
    const isNow = m.m === now;
    const year = new Date().getFullYear();
    const dateStr = `${year}-${String(m.m).padStart(2,'0')}-15`;
    return `
      <div class="climate-month" style="${isNow ? 'border-color:#E07A20; border-width:1.5px;' : ''}"
           onclick="document.getElementById('outfit-date').value='${dateStr}'; queryOutfit('${cityKey}');"
           style="cursor:pointer;">
        <div class="cm-header">
          <span style="font-size:20px;">${m.icon}</span>
          <div style="flex:1;">
            <div class="cm-month" style="${isNow ? 'color:#E07A20;' : ''}">
              ${m.label}
              ${isNow ? '<span style="font-size:16px; background:#FFF3E0; color:#E07A20; padding:2px 7px; border-radius:10px; margin-left:6px;">現在</span>' : ''}
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:16px; font-weight:700;">
              <span style="color:#D03040;">${m.tempMax}°</span>
              <span style="color:var(--muted);"> / </span>
              <span style="color:#3B8FD4;">${m.tempMin}°</span>
            </div>
            <div style="font-size:16px; color:var(--muted);">點擊查詢穿著</div>
          </div>
        </div>
      </div>`;
  }).join('');
}

async function queryOutfit(cityKey) {
  const dateInput = document.getElementById('outfit-date');
  const date = dateInput?.value;
  if (!date) return;

  const el = document.getElementById('outfit-result');
  el.innerHTML = `<div class="loading"><div class="spinner"></div><div>根據歷史資料計算穿著建議中…</div></div>`;

  try {
    const r = await fetch(`${API_BASE}/api/outfit?city=${cityKey}&date=${date}`);
    const data = await r.json();
    renderOutfit(data);
  } catch {
    el.innerHTML = `<div style="color:var(--danger); padding:16px; text-align:center;">無法取得資料，請重試</div>`;
  }
}

function renderOutfit(data) {
  const el = document.getElementById('outfit-result');
  const o = data.outfit;
  const dateLabel = new Date(data.date + 'T00:00:00').toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric' });

  el.innerHTML = `
    <div style="background:var(--surface); border:1.5px solid #E07A20; border-radius:12px; padding:14px; margin-bottom:16px;">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
        <span style="font-size:22px;">${o.icon}</span>
        <div>
          <div style="font-size:16px; font-weight:700;">${data.city}・${dateLabel}</div>
          <div style="font-size:16px; color:var(--muted);">
            預估氣溫 <span style="color:#D03040; font-weight:700;">${o.avgTempMax}°C</span> /
            <span style="color:#3B8FD4; font-weight:700;">${o.avgTempMin}°C</span>
            ${data.isPast ? '（實際歷史資料）' : '（過去5年同期平均）'}
          </div>
        </div>
      </div>

      ${o.warning ? `<div style="background:#FFF3E0; border:1px solid #FFCC80; border-radius:8px; padding:8px 12px; font-size:16px; color:#8B4500; margin-bottom:10px;">${o.warning}</div>` : ''}

      <div style="font-size:15px; font-weight:700; color:var(--muted); margin-bottom:6px; letter-spacing:0.06em;">👕 上身穿搭</div>
      ${o.layers.map(l => `
        <div style="display:flex; gap:8px; align-items:flex-start; padding:7px 10px; background:var(--surface2); border-radius:8px; margin-bottom:5px; font-size:15px;">
          <span style="color:#E07A20; font-weight:700; flex-shrink:0;">▸</span>
          <span>${l}</span>
        </div>`).join('')}

      <div style="font-size:15px; font-weight:700; color:var(--muted); margin:10px 0 6px; letter-spacing:0.06em;">👟 其他穿著</div>
      ${o.items.map(i => `
        <div style="display:flex; gap:8px; align-items:flex-start; padding:7px 10px; background:var(--surface2); border-radius:8px; margin-bottom:5px; font-size:15px;">
          <span style="color:#3B8FD4; font-weight:700; flex-shrink:0;">▸</span>
          <span>${i}</span>
        </div>`).join('')}

      <div style="background:#F5F5F5; border-radius:8px; padding:8px 12px; font-size:15px; color:var(--muted); margin-top:10px;">
        💡 ${o.seasonNote}
      </div>
    </div>
  `;
}



async function loadCity(cityKey) {
  if (cache[cityKey]) {
    renderCity(cityKey, cache[cityKey]);
    return;
  }

  document.getElementById(`page-${cityKey}`).innerHTML =
    `<div class="loading"><div class="spinner"></div><div>取得${getCityName(cityKey)}天氣中…</div></div>`;

  try {
    const res = await fetch(`${API_BASE}/api/city?city=${cityKey}`);
    const data = await res.json();
    cache[cityKey] = data;
    renderCity(cityKey, data);
  } catch (err) {
    document.getElementById(`page-${cityKey}`).innerHTML =
      `<div class="loading" style="color:var(--danger);">⚠️ 無法取得資料，請重新整理</div>`;
  }
}

function getCityName(key) {
  return { asahikawa: '旭川', biei: '美瑛', furano: '富良野' }[key] || key;
}

function switchCity(cityKey, el) {
  currentCity = cityKey;
  document.querySelectorAll('.city-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.city-content').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${cityKey}`).classList.add('active');
  loadCity(cityKey);
  if (currentMode === 'forecast') loadForecast(cityKey);
  if (currentMode === 'climate') loadClimate(cityKey);
}

function renderCity(cityKey, d) {
  const w = d.weather;
  const adv = d.advice;

  // Summary banner
  const bannerClass = !adv.activityOk && !adv.driveOk ? 'banner-danger'
    : !adv.driveOk ? 'banner-warn' : 'banner-ok';
  const bannerIcon = !adv.activityOk && !adv.driveOk ? '⛔'
    : !adv.driveOk ? '⚠️' : '✅';

  // Tips
  const tipsHtml = adv.tips.length > 0
    ? adv.tips.map(t => `<div class="tip-item"><div class="tip-dot"></div><div>${t}</div></div>`).join('')
    : `<div class="tip-item"><div class="tip-dot"></div><div>今日天氣良好，出遊請仍注意保暖</div></div>`;

  // Spots
  const spotsHtml = d.spots?.length > 0
    ? d.spots.map(s => {
        const icon = adv.activityOk ? '✓' : '△';
        const cls  = adv.activityOk ? 'ok' : 'warn';
        const query = encodeURIComponent(`${s.name} ${d.city} 北海道`);
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${query}`;
        return `<a href="${mapsUrl}" target="_blank" rel="noopener" style="text-decoration:none;">
          <div class="spot-chip ${cls}">${icon} ${s.name}<span class="spot-type">${s.type}</span> <span style="font-size:11px; opacity:0.6;">↗</span></div>
        </a>`;
      }).join('')
    : '<div class="spot-chip">今日無適合景點推薦</div>';

  // 動態趨勢：根據季節和天氣決定顯示降雪或降雨機率
  const month = new Date().getMonth() + 1;
  const isWinter = month >= 11 || month <= 3;
  const hasSnow = d.snowTrend.some(s => s.snow > 0);
  const hasPop = d.popTrend && d.popTrend.some(p => p.pop > 0);

  let trendTitle, trendIcon, trendBarColor, trendValues, trendUnit;

  if (isWinter && hasSnow) {
    // 冬季且有降雪 → 顯示降雪量
    trendTitle = '未來 6 小時降雪趨勢';
    trendIcon = '❄️';
    trendBarColor = '#7DD3F7';
    trendUnit = 'mm';
    trendValues = d.snowTrend.map(s => ({ hour: s.hour, val: s.snow }));
  } else if (hasPop) {
    // 有降雨機率 → 顯示降雨機率
    trendTitle = '未來 6 小時降雨機率';
    trendIcon = '🌧️';
    trendBarColor = '#60A5FA';
    trendUnit = '%';
    trendValues = d.popTrend.map(p => ({ hour: p.hour, val: p.pop }));
  } else if (isWinter) {
    // 冬季無降雪也無雨 → 顯示降雪趨勢（全零）
    trendTitle = '未來 6 小時降雪趨勢';
    trendIcon = '❄️';
    trendBarColor = '#7DD3F7';
    trendUnit = 'mm';
    trendValues = d.snowTrend.map(s => ({ hour: s.hour, val: s.snow }));
  } else {
    // 夏季無雨 → 顯示降雨機率（全零）
    trendTitle = '未來 6 小時降雨機率';
    trendIcon = '🌧️';
    trendBarColor = '#60A5FA';
    trendUnit = '%';
    trendValues = d.popTrend
      ? d.popTrend.map(p => ({ hour: p.hour, val: p.pop }))
      : d.snowTrend.map(s => ({ hour: s.hour, val: 0 }));
  }

  const maxVal = Math.max(...trendValues.map(t => t.val), 0.1);
  const allZero = trendValues.every(t => t.val === 0);

  const trendHtml = allZero
    ? `<div style="width:100%; text-align:center; font-size:16px; color:var(--muted); padding:8px 0;">今後 6 小時無${trendUnit === '%' ? '降雨' : '降雪'}預測</div>`
    : trendValues.map(t => {
        const pct = Math.max((t.val / maxVal) * 100, 4);
        return `<div class="trend-bar-wrap">
          <div style="font-size:15px; color:var(--muted); margin-bottom:2px;">${t.val}${trendUnit}</div>
          <div class="trend-bar" style="height:${pct}%; background:${trendBarColor};"></div>
          <div class="trend-hour">${t.hour}</div>
        </div>`;
      }).join('');

  // JMA alerts
  let alertsHtml = '';
  if (d.jmaAlerts?.length > 0) {
    alertsHtml = d.jmaAlerts.map(a =>
      `<div class="alert alert-${a.type}">
        <div class="alert-icon">${a.icon}</div>
        <div class="alert-label">${a.label}</div>
      </div>`
    ).join('');
  } else {
    alertsHtml = `<div class="alert alert-ok">
      <div class="alert-icon">✅</div>
      <div class="alert-label">氣象廳今日無警報發佈</div>
    </div>`;
  }

  document.getElementById(`page-${cityKey}`).innerHTML = `
    <!-- 主天氣卡 -->
    <div class="main-card">
      <div class="main-card-top">
        <div class="city-info">
          <div class="city-name">
            ${d.city}
            <span style="font-size:22px;">${w.emoji}</span>
            <span style="font-size:15px; font-weight:500; color:var(--muted);">${w.label}</span>
          </div>
          <div class="feels-like" style="font-size:16px; color:var(--muted);">體感 ${w.feelsLike}°C</div>
        </div>
        <div class="temp-display">
          <div>
            <span class="temp-big">${w.temp}</span>
            <span class="temp-unit">°C</span>
          </div>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-icon">💨</div>
          <div class="stat-val">${w.windSpeed}<small>m/s</small></div>
          <div class="stat-lbl">風速</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">❄️</div>
          <div class="stat-val">${w.snowfall}<small>mm</small></div>
          <div class="stat-lbl">降雪</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">🌧️</div>
          <div class="stat-val">${w.rain}<small>mm</small></div>
          <div class="stat-lbl">降雨</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">💧</div>
          <div class="stat-val">${w.humidity}<small>%</small></div>
          <div class="stat-lbl">濕度</div>
        </div>
      </div>
    </div>

    <!-- 今日穿著建議 -->
    <div class="summary-banner ${bannerClass}">
      <div class="banner-icon">${bannerIcon}</div>
      <div>
        <div style="font-size:15px; font-weight:700; letter-spacing:0.08em; color:var(--muted); margin-bottom:4px;">👕 今日建議穿著（台灣人體感）</div>
        <div class="banner-text">${adv.summary}</div>
      </div>
    </div>

    <!-- 旅遊提示 -->
    <div class="tips-section">
      <div class="tips-title">📌 在地旅遊提示</div>
      ${tipsHtml}
    </div>

    <!-- 推薦景點 -->
    <div class="spots-section">
      <div class="tips-title">📍 今日推薦景點</div>
      <div class="spots-row">${spotsHtml}</div>
    </div>

    <!-- 未來6小時趨勢 -->
    <div class="trend-section">
      <div class="tips-title">${trendIcon} ${trendTitle}</div>
      <div class="trend-bars">${trendHtml}</div>
    </div>

    <!-- 氣象廳官方警報 -->
    <div class="alerts-section">
      <div class="tips-title">🏛️ 氣象廳官方提醒</div>
      ${alertsHtml}
    </div>

    <div class="updated-row">資料更新時間：${d.updatedAt}</div>
  `;
}

// 初始載入
window.addEventListener('DOMContentLoaded', async () => {
  await loadCity('asahikawa');
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
});
</script>
</body>
</html>
