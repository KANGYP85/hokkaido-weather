<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--text:#1C1C1E;--text2:#3A3A3C;
  --muted:#8E8E93;--border:rgba(0,0,0,0.08);
  --blue:#1A7ACC;--radius:14px;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Noto Sans TC',-apple-system,sans-serif;
  min-height:100vh;max-width:430px;margin:0 auto;
  padding-bottom:48px;-webkit-font-smoothing:antialiased;
}
.header{background:var(--blue);padding:52px 20px 20px;}
.header h1{font-size:20px;font-weight:700;color:#fff;margin-bottom:2px;}
.header p{font-size:13px;color:rgba(255,255,255,0.65);}

.sec-label{
  font-size:13px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.06em;
  margin:20px 16px 8px;
}
.card{background:var(--card);border-radius:var(--radius);margin:0 16px;overflow:hidden;}

/* Place rows */
.place-row{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:0.5px solid var(--border);}
.place-row:last-child{border-bottom:none;}
.place-row i{font-size:18px;color:var(--blue);margin-top:1px;flex-shrink:0;}
.place-name{font-size:15px;font-weight:600;color:var(--text);}
.place-desc{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.5;}
.place-warn{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;color:#C04D00;background:rgba(255,107,0,0.1);
  border-radius:6px;padding:2px 7px;margin-top:5px;
}

/* Category grid */
.cat-wrap{margin:12px 16px 0;}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.cat-btn{
  background:var(--card);border-radius:12px;padding:12px 4px;
  text-align:center;cursor:pointer;transition:all 0.15s;
  border:1.5px solid transparent;
}
.cat-btn:active{opacity:0.8;}
.cat-btn.active{background:#A8C46B;border-color:#A8C46B;}
.cat-btn.special{background:#FFF0E6;border-color:#FFB89A;}
.cat-btn.special.active{background:#A8C46B;border-color:#A8C46B;}
.cat-em{font-size:24px;margin-bottom:5px;line-height:1;}
.cat-name{font-size:10px;color:var(--muted);line-height:1.35;}
.cat-btn.active .cat-name{color:#fff;}
.cat-btn.special .cat-name{color:#C04D00;font-weight:600;}
.cat-btn.special.active .cat-name{color:#fff;}

/* Items */
.items-wrap{margin:12px 16px 0;display:flex;flex-direction:column;gap:6px;}
.item-card{background:var(--card);border-radius:var(--radius);overflow:hidden;cursor:pointer;}
.item-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;}
.item-left{display:flex;align-items:center;gap:10px;}
.item-em{font-size:20px;width:28px;text-align:center;flex-shrink:0;}
.item-name{font-size:15px;font-weight:500;color:var(--text);}
.item-jp{font-size:11px;color:var(--muted);margin-top:1px;}
.item-chev{font-size:16px;color:var(--muted);transition:transform 0.2s;flex-shrink:0;}
.item-card.open .item-chev{transform:rotate(180deg);}
.item-body{display:none;border-top:0.5px solid var(--border);padding:10px 16px;background:#FAFAFA;}
.item-card.open .item-body{display:block;}
.part-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border);
}
.part-row:last-of-type{border-bottom:none;}
.part-name{font-size:13px;color:var(--text2);}
.part-jp{font-size:10px;color:var(--muted);margin-top:1px;}
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;flex-shrink:0;}
.b-burn   {background:#FFF0E6;color:#C04D00;}
.b-pla    {background:#E8F5EE;color:#1A7A4A;}
.b-pet    {background:#E6F0FB;color:#1A5FA0;}
.b-can    {background:#F2F2F2;color:#555;}
.b-glass  {background:#E8F5F2;color:#0A6050;}
.b-paper  {background:#FDF5E0;color:#8A5A00;}
.b-nonburn{background:#EEF0F8;color:#3A4A90;}
.b-battery{background:#FDE8EE;color:#A01840;}
.b-hotel  {background:#F2F2F2;color:#555;}
.b-sep    {background:#F2F2F2;color:#555;}
.item-note{font-size:12px;color:var(--muted);line-height:1.5;padding-top:7px;margin-top:4px;border-top:0.5px solid var(--border);}
.item-note.warn{color:#C04D00;}

footer{text-align:center;padding:24px 20px;font-size:12px;color:var(--muted);line-height:1.9;}

  grid.innerHTML = CATS.map(c => `
    <div class="cat-btn${c.special?' special':''}${c.id===currentCat?' active':''}" onclick="selectCat('${c.id}')">
      <div class="cat-em">${c.em}</div>
      <div class="cat-name">${c.name.replace('\n','<br>')}</div>
    </div>`).join('');
}

function selectCat(id) {
  currentCat = id;
  openIdx = null;
  renderCats();
  renderItems();
}

function toggle(idx) {
  openIdx = openIdx === idx ? null : idx;
  renderItems();
}

function renderItems() {
  const list = ITEMS.filter(item => item.cat === currentCat);
  const wrap = document.getElementById('items-wrap');
  wrap.innerHTML = list.map((item, i) => {
    const isOpen = openIdx === i;
    const parts = item.parts.map(p => `
      <div class="part-row">
        <div><div class="part-name">${p.n}</div></div>
        <span class="badge b-${p.b}">${p.bl}</span>
      </div>`).join('');
    const note = item.note ? `<div class="item-note${item.noteWarn?' warn':''}">${item.note}</div>` : '';
    return `
      <div class="item-card${isOpen?' open':''}" onclick="toggle(${i})">
        <div class="item-hd">
          <div class="item-left">
            <span class="item-em">${item.emoji}</span>
            <div>
              <div class="item-name">${item.name}</div>
              <div class="item-jp">${item.jp}</div>
            </div>
          </div>
          <i class="ti ti-chevron-down item-chev"></i>
        </div>
        <div class="item-body">${parts}${note}</div>
      </div>`;
  }).join('');
}

renderCats();
renderItems();
</script>
</body>
</html>
